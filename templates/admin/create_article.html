{% extends "admin/base_admin.html" %}

{% block title %}Create Article | DailyAIWire Admin{% endblock %}

{% block admin_content %}
<div class="container mx-auto px-4 py-12 max-w-4xl">
    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('admin.index') }}" class="text-zinc-500 hover:text-white transition-colors">
            &larr; Back to Dashboard
        </a>
    </div>

    <div class="glass-card rounded-2xl border border-zinc-800 bg-zinc-900/50 p-10">
        <h1 class="text-3xl font-bold text-white mb-10">Create New Article</h1>

        <form method="POST" enctype="multipart/form-data" class="space-y-8">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <!-- Basic Info -->
            <div class="space-y-6">
                <h2 class="text-xl font-bold text-blue-400">Basic Information</h2>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Title *</label>
                    <input type="text" name="title" required aria-label="Article Title"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Slug (auto-generated if empty)</label>
                    <input type="text" name="slug" aria-label="Article Slug"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Category *</label>
                    <select name="category" required aria-label="Article Category"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Select Category</option>
                        {% for cat in ['Business', 'Technology', 'Policy', 'Science', 'Tools', 'Security', 'Finance',
                        'Health', 'Energy', 'LLMs', 'Robotics', 'Society', 'AI Agents'] %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Published Date (auto-set if
                        empty)</label>
                    <input type="datetime-local" name="published_at" aria-label="Published Date"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Content -->
            <div class="space-y-6">
                <h2 class="text-xl font-bold text-blue-400">Content</h2>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">The Gist</label>
                    <textarea name="gist" rows="3" aria-label="Article Gist"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Why It Matters</label>
                    <textarea name="why_it_matters" rows="3" aria-label="Why It Matters"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Bull Case (Optimistic Outlook)</label>
                    <textarea name="bull_case" rows="3" aria-label="Bull Case"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Bear Case (Risk Factors)</label>
                    <textarea name="bear_case" rows="3" aria-label="Bear Case"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Deep Analysis</label>
                    <textarea name="deep_analysis" rows="6" aria-label="Deep Analysis"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>

            <!-- Media -->
            <div class="space-y-6">
                <h2 class="text-xl font-bold text-blue-400">Media</h2>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Image URL</label>
                    <input type="url" name="image_url" placeholder="https://..." aria-label="Image URL"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-zinc-500 mt-1">Or upload a file below</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Upload Image</label>
                    <input type="file" name="image_file" accept="image/*" aria-label="Upload Image File"
                        class="block w-full text-sm text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Upload Male Audio</label>
                    <input type="file" name="audio_male_file" accept="audio/*" aria-label="Upload Male Audio"
                        class="block w-full text-sm text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Upload Female Audio</label>
                    <input type="file" name="audio_female_file" accept="audio/*" aria-label="Upload Female Audio"
                        class="block w-full text-sm text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                </div>
            </div>

            <!-- Source -->
            <div class="space-y-6">
                <h2 class="text-xl font-bold text-blue-400">Source</h2>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Source Name</label>
                    <input type="text" name="source" placeholder="e.g., TechCrunch" aria-label="Source Name"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Source URL</label>
                    <input type="url" name="source_url" placeholder="https://..." aria-label="Source URL"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-4 pt-6 border-t border-zinc-800">
                <button type="submit"
                    class="flex-1 bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">
                    Create Article
                </button>
                <a href="{{ url_for('admin.index') }}"
                    class="px-8 py-3 bg-zinc-800 text-zinc-300 rounded-xl font-bold hover:bg-zinc-700 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
