{% extends 'admin/index.html' %}

{% block body %}
<div class="p-8">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-black uppercase tracking-tighter text-white">Intelligence Reports</h1>
        <a href="/admin/newsletter/generate"
            class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest shadow-lg shadow-blue-600/20 transition-all">
            Generate New Weekly Draft
        </a>
    </div>

    <div class="grid grid-cols-1 gap-6">
        {% for nl in newsletters %}
        <div
            class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 flex items-center justify-between group hover:border-blue-600/50 transition-all">
            <div class="flex items-center space-x-6">
                <div
                    class="w-12 h-12 rounded-2xl bg-zinc-950 border border-zinc-800 flex items-center justify-center text-blue-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2zM14 2v4h4"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-white mb-1">{{ nl.subject }}</h2>
                    <div class="flex items-center space-x-4 text-xs font-bold uppercase tracking-widest">
                        <span class="{% if nl.status == 'SENT' %}text-green-500{% else %}text-orange-500{% endif %}">{{
                            nl.status }}</span>
                        <span class="text-zinc-600">•</span>
                        <span class="text-zinc-500">Scheduled: {{ nl.scheduled_date }}</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-3 opacity-0 group-hover:opacity-100 transition-opacity">
                <a href="/admin/newsletter/edit/{{ nl.id }}"
                    class="px-4 py-2 bg-zinc-800 text-white rounded-lg text-xs font-bold hover:bg-zinc-700 transition-colors">Edit</a>
                <a href="/admin/newsletter/delete/{{ nl.id }}" onclick="return confirm('Purge this report?')"
                    class="px-4 py-2 bg-red-600/10 text-red-500 rounded-lg text-xs font-bold hover:bg-red-600 hover:text-white transition-all">Delete</a>
            </div>
        </div>
        {% else %}
        <div class="text-center py-20 border-2 border-dashed border-zinc-800 rounded-3xl">
            <p class="text-zinc-500 font-bold uppercase tracking-widest">No intelligence reports generated yet.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
