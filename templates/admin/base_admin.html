{% extends "base.html" %}

{% block title %}Admin | DailyAIWire{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12 max-w-7xl">
    <div class="flex justify-between items-center mb-10">
        <h1 class="text-3xl font-bold text-white">Admin Dashboard</h1>
        <div class="flex items-center gap-4">
            <a href="{{ url_for('admin_subscribers') }}"
                class="bg-blue-600/10 hover:bg-blue-600 text-blue-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-blue-600/20 text-sm font-bold">
                👥 Subscribers
            </a>
            <a href="{{ url_for('admin_newsletters') }}"
                class="bg-blue-600/10 hover:bg-blue-600 text-blue-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-blue-600/20 text-sm font-bold">
                📩 Newsletters
            </a>
            <a href="{{ url_for('admin_editorials') }}"
                class="bg-purple-600/10 hover:bg-purple-600 text-purple-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-purple-600/20 text-sm font-bold">
                📝 Reports & Editorials
            </a>
            <a href="{{ url_for('admin_create_article') }}"
                class="bg-green-600/20 hover:bg-green-600 text-green-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-green-600/50 text-sm font-bold">
                + New Article
            </a>
            <a href="{{ url_for('admin_budget') }}"
                class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-indigo-600/50 text-sm font-bold">
                💰 Cost
            </a>
            <a href="{{ url_for('admin_sources') }}"
                class="bg-amber-600/20 hover:bg-amber-600 text-amber-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-amber-600/50 text-sm font-bold">
                📡 Sources
            </a>
            <a href="{{ url_for('logout') }}"
                class="bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-red-600/50 text-sm font-bold">
                Logout
            </a>
        </div>
    </div>

    {% block admin_content %}{% endblock %}
</div>
{% endblock %}
