{% extends "base.html" %}

{% block title %}Stock Image Manager | DailyAIWire Admin{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12 max-w-7xl">
    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('admin.index') }}" class="text-zinc-500 hover:text-white transition-colors">
            &larr; Back to Dashboard
        </a>
    </div>
    <div class="glass-card rounded-2xl border border-zinc-800 bg-zinc-900/50 p-10">
        <h1 class="text-3xl font-bold text-white mb-10">Stock Image Manager</h1>

        <form method="POST" enctype="multipart/form-data" class="space-y-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Category</label>
                    <select name="category" aria-label="Select Category"
                        class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        {% for cat in ['Business', 'Technology', 'Policy', 'Science', 'Tools', 'Security', 'Finance',
                        'Health', 'Energy', 'LLMs', 'Robotics', 'Society'] %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-2">Upload Image</label>
                    <input type="file" name="file" accept="image/*" required aria-label="Upload File"
                        class="block w-full text-sm text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
                </div>
            </div>
            <button type="submit"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors">Upload</button>
        </form>

        <h2 class="text-xl font-bold text-white mb-4">Existing Files</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            {% for cat, files in files.items() %}
            {% for file in files %}
            <div class="relative group">
                <img src="/static/stock/{{ cat }}/{{ file }}" alt="Stock image {{ file }} in {{ cat }}"
                    class="w-full h-32 object-cover rounded-lg">
                <div
                    class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-lg">
                    <span class="text-white text-xs">{{ cat }}/{{ file }}</span>
                </div>
            </div>
            {% endfor %}
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
