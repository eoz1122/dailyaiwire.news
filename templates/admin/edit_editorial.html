{% extends "admin/base_admin.html" %}

{% block admin_content %}
<div class="glass-card rounded-2xl border border-zinc-800 bg-zinc-900/50 overflow-hidden shadow-2xl p-8">
    <div class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-4">
        <h2 class="text-2xl font-bold text-white">{% if id == 'new' %}Create New{% else %}Edit{% endif %} Editorial</h2>
        <a href="{{ url_for('admin_editorials') }}" class="text-zinc-500 hover:text-white">Cancel</a>
    </div>

    <form method="POST" class="space-y-6">
        <div>
            <label for="title"
                class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Title</label>
            <input id="title" type="text" name="title" value="{{ post.title or '' }}" required
                class="w-full bg-zinc-800 border border-zinc-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-lg">
        </div>

        <div>
            <label for="subtitle" class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Subtitle
                / Hook</label>
            <textarea id="subtitle" name="subtitle" rows="2"
                class="w-full bg-zinc-800 border border-zinc-700 text-zinc-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">{{ post.subtitle or '' }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div>
                <label for="slug" class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Slug
                    (Auto-generated if empty)</label>
                <input id="slug" type="text" name="slug" value="{{ post.slug or '' }}"
                    class="w-full bg-zinc-800 border border-zinc-700 text-zinc-400 rounded-lg px-4 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="pub_date"
                    class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Publish Date</label>
                <input id="pub_date" type="text" disabled value="{{ post.published_at or 'Now on Save' }}"
                    class="w-full bg-zinc-900 border border-zinc-800 text-zinc-500 rounded-lg px-4 py-2 text-sm">
            </div>
        </div>

        <div>
            <label for="content" class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Content
                (HTML Supported)</label>
            <textarea id="content" name="content" rows="15" required
                class="w-full bg-zinc-800 border border-zinc-700 text-zinc-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm leading-relaxed">{{ post.content or '' }}</textarea>
            <p class="text-xs text-zinc-600 mt-2">Use &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt; tags for formatting.</p>
        </div>

        <div class="pt-6 border-t border-zinc-800 flex justify-end gap-4">
            {% if id != 'new' %}
            <!-- Add Delete Button Logic Here Later -->
            {% endif %}
            <button type="submit"
                class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-lg font-bold shadow-lg hover:shadow-blue-500/20 transition-all">
                {% if id == 'new' %}Publish Post{% else %}Save Changes{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
