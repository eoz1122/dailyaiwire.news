<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Wire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            color: #0c0c0c;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 100%;
            background-color: #fcfcfc;
            padding-bottom: 60px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 40px;
            border: 1px solid #e4e4e7;
            border-radius: 24px;
            margin-top: 40px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background-color: #f4f4f5;
            border-radius: 16px;
            padding: 8px;
            margin-bottom: 20px;
        }

        .h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        .p {
            font-size: 16px;
            line-height: 1.6;
            color: #52525b;
            margin-bottom: 24px;
        }

        /* Force color with !important to override Gmail/Apple Mail default link blue */
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff !important;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            -webkit-text-fill-color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <img src="https://dailyaiwire.news/static/img/brand/logo_nodes.png" class="logo" alt="DailyAIWire">
            <div class="h1">Signal Acquired.</div>
            <p class="p">You have successfully connected to the Daily AI Wire.</p>
            <p class="p">This is your confirmation that you are now part of our autonomous intelligence network. Expect
                your first briefing this Sunday.</p>
            <p class="p">We filter the noise so you can focus on the signal.</p>
            <!-- Inline style backup for extra safety -->
            <a href="https://dailyaiwire.news" class="btn"
                style="color: #ffffff !important; text-decoration: none;">Access the Lab</a>
        </div>
    </div>
</body>

</html>
