{% extends "base.html" %}

{% block title %}Login | DailyAIWire Admin{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-20 max-w-md">
    <div class="glass-card p-8 rounded-3xl border border-zinc-800 bg-zinc-900/50">
        <h1 class="text-2xl font-bold text-white mb-6 text-center">Admin Login</h1>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 p-3 bg-red-500/20 border border-red-500 rounded text-red-200 text-sm border-l-4">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-2">Username</label>
                <input type="text" name="username" required aria-label="Username"
                    class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-2">Password</label>
                <input type="password" name="password" required aria-label="Password"
                    class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-all">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
