server {
    server_name dailyaiwire.news www.dailyaiwire.news;

    # Allow Let's Encrypt validation
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # Serve ads.txt from root
    location = /ads.txt {
        alias /home/dailyai/dailyaiwire.news/static/ads.txt;
    }

    # Static files with aggressive caching
    location /static {
        alias /home/dailyai/dailyaiwire.news/static;
        
        # Cache images for 1 year
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Cache fonts for 1 year
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Cache audio for 1 year
        location ~* \.(mp3|wav|ogg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Cache CSS/JS for 1 month
        location ~* \.(css|js)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # Default for other static files
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dailyaiwire.news/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dailyaiwire.news/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.dailyaiwire.news) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = dailyaiwire.news) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name dailyaiwire.news www.dailyaiwire.news;
    return 404; # managed by Certbot
}
