# F-15: Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

# ═══════════════════════════════════════════════════════════════════
# SEO FIX: www → non-www 301 redirect (HTTPS)
# Prevents duplicate content across www and non-www domains.
# Applied: 2026-03-14
# ═══════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name www.dailyaiwire.news;

    ssl_certificate /etc/letsencrypt/live/dailyaiwire.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dailyaiwire.news/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dailyaiwire.news$request_uri;
}

# ═══════════════════════════════════════════════════════════════════
# Main server block — canonical domain: dailyaiwire.news
# ═══════════════════════════════════════════════════════════════════
server {
    # STRICT DOMAIN MATCHING (non-www only)
    server_name dailyaiwire.news;

    # Allow Let's Encrypt validation
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # Serve ads.txt from root
    location = /ads.txt {
        alias /home/dailyai/dailyaiwire.news/static/ads.txt;
    }

    # Static files with aggressive caching
    location /static {
        alias /home/dailyai/dailyaiwire.news/static;
        
        # Prevent Google from wasting crawl budget on static assets
        add_header X-Robots-Tag "noindex" always;
        
        # Cache images for 1 year
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex" always;
        }
        
        # Cache fonts for 1 year
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex" always;
        }
        
        # Cache audio for 1 year
        location ~* \.(mp3|wav|ogg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex" always;
        }
        
        # Cache CSS/JS for 1 month
        location ~* \.(css|js)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex" always;
        }
        
        # Default for other static files
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy to Gunicorn
    location / {
        # F-15: Rate limiting + body size
        limit_req zone=general burst=20 nodelay;
        client_max_body_size 10m;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    }

    # F-15: Stricter rate limit on login
    location /login {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dailyaiwire.news/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dailyaiwire.news/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ═══════════════════════════════════════════════════════════════════
# HTTP → HTTPS redirect (both www and non-www)
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name dailyaiwire.news www.dailyaiwire.news;
    return 301 https://dailyaiwire.news$request_uri;
}
